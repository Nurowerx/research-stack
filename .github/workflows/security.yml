name: Security
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  scans:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - run: pip-audit -r requirements-lock.txt --disable-pip --no-deps --format json --output pip-audit.json
      - run: npm ci && npm audit --audit-level=low --json > npm-audit.json
      - run: bandit -r packages services -f json -o bandit.json
      - run: python scripts/security_tools.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-evidence
          path: |
            pip-audit.json
            npm-audit.json
            bandit.json
            gitleaks.json
          retention-days: 30
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279
