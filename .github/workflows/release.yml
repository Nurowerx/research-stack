name: Release
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['pyproject.toml']
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python scripts/release_gate.py --wait-seconds 1200
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate release version and tag
        run: python scripts/package_release.py --check
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - name: Collect exact-commit verification and raw validation artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_gate.py --output dist/final-verification.json
          python scripts/package_release.py --github-evidence
      - name: Stage, verify downloads, and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python scripts/package_release.py --check)
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --draft --title "$tag — Maintenance release" --notes-file docs/release-notes.md
          verification_dir=$(mktemp -d)
          gh release download "$tag" --dir "$verification_dir"
          (cd "$verification_dir" && sha256sum --check SHA256SUMS.txt)
          gh release edit "$tag" --draft=false --latest
